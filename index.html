    /* ===== POST CARD ===== */

<!-- ===== JAVASCRIPT ===== -->
<script>
    (function() {
        'use strict';

        // ============================================================
        // 📝 ALL POSTS - Complete List
        // ============================================================
        var posts = [
            // Programming Languages
            { title: 'Bash Scripting for Ethical Hackers', url: 'https://sumetech98-afk.github.io/bashscriptin_post/', category: 'Linux' },
            { title: 'Python for Hackers', url: 'https://sumetech98-afk.github.io/Python_for-Hacker/', category: 'Programming' },
            { title: 'Ruby Programming', url: 'https://sumetech98-afk.github.io/Ruby_Post/', category: 'Programming' },
            { title: 'PowerShell Automation', url: 'https://sumetech98-afk.github.io/powershell_post/', category: 'Windows' },
            { title: 'C and C++ Programming', url: 'https://sumetech98-afk.github.io/c-c-_post/', category: 'Programming' },
            { title: 'SQL for Beginners', url: 'https://sumetech98-afk.github.io/sql_post/', category: 'Database' },
            { title: 'JavaScript Essentials', url: 'https://sumetech98-afk.github.io/javascript_post/', category: 'Programming' },
            { title: 'PHP Programming for Ethical Hackers', url: 'https://sumetech98-afk.github.io/php_post/', category: 'Programming' },

            // Security Tools
            { title: 'Nessus Tools', url: 'https://sumetech98-afk.github.io/Nessus_tools/', category: 'Security Tools' },
            { title: 'Kali Linux Commands', url: 'https://sumetech98-afk.github.io/Kali_commands/', category: 'Linux' },
            { title: 'Burp Suite Tools', url: 'https://sumetech98-afk.github.io/Brupsuit_tools/', category: 'Security Tools' },
            { title: 'Metasploit Framework', url: 'https://sumetech98-afk.github.io/Metasploit/', category: 'Security Tools' },
            { title: 'OWASP Amass', url: 'https://sumetech98-afk.github.io/OWASP-Amass-/', category: 'Security Tools' },
            { title: 'Nmap Network Scanner', url: 'https://sumetech98-afk.github.io/Nmap/', category: 'Security Tools' },
            { title: 'Dirb Web Scanner', url: 'https://sumetech98-afk.github.io/Dirb_tools/', category: 'Security Tools' },
            { title: 'Wireshark Analysis', url: 'https://sumetech98-afk.github.io/Wireshark/', category: 'Security Tools' },
            { title: 'Nikto Tools', url: 'https://sumetech98-afk.github.io/Nikto_tools/', category: 'Security Tools' },

            // Cybersecurity Career
            { title: 'Bug Bounty Hunter', url: 'https://sumetech98-afk.github.io/Bugbounty_hunter/', category: 'Ethical Hacking' },
            { title: 'Vulnerability Assessor', url: 'https://sumetech98-afk.github.io/Vulnerability-Assessor-/', category: 'Ethical Hacking' },
            { title: 'Security Analyst', url: 'https://sumetech98-afk.github.io/Security-Analyst/', category: 'Ethical Hacking' }
        ];
        // ============================================================

        // ===== STATE =====
        var filteredPosts = [];
        var searchTerm = '';
        var currentCategory = 'all';
        var categories = [];

        // ===== DOM REFERENCES =====
        var postsGrid = document.getElementById('postsGrid');
        var totalCount = document.getElementById('totalCount');
        var categoryCount = document.getElementById('categoryCount');
        var showCount = document.getElementById('showCount');
        var totalShowCount = document.getElementById('totalShowCount');
        var searchInput = document.getElementById('searchInput');
        var clearSearchBtn = document.getElementById('clearSearchBtn');
        var categoryFilter = document.getElementById('categoryFilter');
        var toast = document.getElementById('toast');

        // ===== STORAGE =====
        var STORAGE_KEY = 'cybersume_github_posts';

        // ===== GET CATEGORIES =====
        function getCategories() {
            var cats = {};
            for (var i = 0; i < posts.length; i++) {
                var cat = posts[i].category || 'Uncategorized';
                if (!cats[cat]) cats[cat] = 0;
                cats[cat]++;
            }
            return cats;
        }

        // ===== LOAD POSTS =====
        function loadPosts() {
            try {
                var data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    var parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        posts = parsed;
                    }
                }
            } catch (e) {
                console.log('Using default posts');
            }
            filterAndRender();
            updateStats();
            renderCategories();
        }

        // ===== RENDER CATEGORIES =====
        function renderCategories() {
            var cats = getCategories();
            var html = '<button class="active" data-category="all">📌 All</button>';
            var catKeys = Object.keys(cats).sort();
            for (var i = 0; i < catKeys.length; i++) {
                html += '<button data-category="' + catKeys[i] + '">' + catKeys[i] + ' (' + cats[catKeys[i]] + ')</button>';
            }
            categoryFilter.innerHTML = html;
            categories = catKeys;

            // Add click events
            var buttons = categoryFilter.querySelectorAll('button');
            for (var j = 0; j < buttons.length; j++) {
                buttons[j].addEventListener('click', function() {
                    var allBtns = categoryFilter.querySelectorAll('button');
                    for (var k = 0; k < allBtns.length; k++) {
                        allBtns[k].classList.remove('active');
                    }
                    this.classList.add('active');
                    currentCategory = this.getAttribute('data-category');
                    filterAndRender();
                });
            }
        }

        // ===== FILTER & RENDER =====
        function filterAndRender() {
            var term = (searchTerm || '').toLowerCase().trim();

            filteredPosts = [];
            for (var i = 0; i < posts.length; i++) {
                var p = posts[i];
                var matchSearch = true;
                var matchCategory = true;

                if (term) {
                    matchSearch = (p.title || '').toLowerCase().includes(term) ||
                        (p.category || '').toLowerCase().includes(term);
                }

                if (currentCategory !== 'all') {
                    matchCategory = (p.category || '') === currentCategory;
                }

                if (matchSearch && matchCategory) {
                    filteredPosts.push(p);
                }
            }

            renderPosts();
            updateStats();
        }

        // ===== RENDER POSTS =====
        function renderPosts() {
            var container = postsGrid;

            if (filteredPosts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">📭</span>
                        <h3>No posts found</h3>
                        <p>${searchTerm || currentCategory !== 'all' ? 'Try adjusting your filters.' : 'No posts available yet.'}</p>
                    </div>
                `;
                showCount.textContent = '0';
                totalShowCount.textContent = posts.length;
                return;
            }

            var icons = {
                'Linux': '🐧',
                'Programming': '💻',
                'Windows': '🪟',
                'Database': '🗄️',
                'Security Tools': '🔧',
                'Ethical Hacking': '🛡️'
            };

            var html = '';
            for (var i = 0; i < filteredPosts.length; i++) {
                var p = filteredPosts[i];
                var icon = icons[p.category] || '📄';
                var safeTitle = escapeHtml(p.title || 'Untitled');
                var safeUrl = escapeHtml(p.url || '#');
                var safeCategory = escapeHtml(p.category || 'Uncategorized');

                html += `
                    <div class="post-card">
                        <div class="post-number">#${i + 1}</div>
                        <div class="post-icon">${icon}</div>
                        <div class="post-title">
                            <a href="${safeUrl}" target="_blank">${safeTitle}</a>
                        </div>
                        <div class="post-category"><span>${safeCategory}</span></div>
                        <div class="post-url">🔗 ${safeUrl}</div>
                        <div class="post-actions">
                            <a class="btn btn-view" href="${safeUrl}" target="_blank">📖 Read</a>
                            <button class="btn btn-copy" onclick="window._cyberCopy('${safeUrl}')">📋 Copy</button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            showCount.textContent = filteredPosts.length;
            totalShowCount.textContent = posts.length;
        }

        // ===== UPDATE STATS =====
        function updateStats() {
            totalCount.textContent = posts.length;
            var cats = getCategories();
            categoryCount.textContent = Object.keys(cats).length;
        }

        // ===== ESCAPE HTML =====
        function escapeHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== COPY TO CLIPBOARD =====
        function copyLink(url) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(function() {
                    showToast('📋 Link copied to clipboard!', 'success');
                }).catch(function() {
                    fallbackCopy(url);
                });
            } else {
                fallbackCopy(url);
            }
        }

        function fallbackCopy(text) {
            var input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                showToast('📋 Link copied to clipboard!', 'success');
            } catch (e) {
                showToast('❌ Failed to copy', 'error');
            }
            document.body.removeChild(input);
        }

        // ===== SHOW TOAST =====
        function showToast(message, type) {
            toast.textContent = message;
            toast.className = 'toast ' + (type || 'success');
            toast.classList.add('show');

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }

        // ===== EXPOSE =====
        window._cyberCopy = copyLink;

        // ===== EVENT LISTENERS =====
        searchInput.addEventListener('input', function() {
            searchTerm = this.value;
            filterAndRender();
        });

        clearSearchBtn.addEventListener('click', function() {
            searchInput.value = '';
            searchTerm = '';
            filterAndRender();
            searchInput.focus();
        });

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                searchInput.focus();
                searchInput.select();
            }
            if (e.key === 'Escape') {
                if (searchInput.value) {
                    searchInput.value = '';
                    searchTerm = '';
                    filterAndRender();
                    searchInput.blur();
                }
            }
        });

        // ===== INIT =====
        loadPosts();

        console.log('📚 CyberSume GitHub Posts loaded!');
        console.log('📖 Total posts: ' + posts.length);
        console.log('📂 Categories: ' + Object.keys(getCategories()).length);

    })();
</script>
