/* ================= RESET ================= */
.cyber-lib * {

/* ================= WRAPPER ================= */
.cyber-lib {
    width: 100%;
    min-height: 100vh;
    background: #000000;
    background-image:

    font-family: 'Outfit', -apple-system, sans-serif;
    color: #ffffff;
    padding: 0;
    overflow-x: hidden;
}

.cyber-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 40px 80px;
}

/* ================= HERO HEADER ================= */
.hero {
    text-align: center;
    padding: 20px 0 48px;
    position: relative;
}

.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
}

.hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 20px;
    background: rgba(0, 255, 136, 0.05);
    border: 1px solid rgba(0, 255, 136, 0.2);
    border-radius: 100px;
    color: #00ff88;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
}

.hero-badge .dot {
    width: 6px;
    height: 6px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 10px #00ff88;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.hero h1 {
    font-size: clamp(36px, 6vw, 72px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.04em;
    margin-bottom: 20px;
    background: linear-gradient(180deg, #ffffff 0%, #8892a8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hero h1 .highlight {
    background: linear-gradient(135deg, #00ff88 0%, #00d9ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
    display: inline-block;
}

.hero p {
    color: #8892a8;
    font-size: 17px;
    font-weight: 300;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
}

/* ================= STATS ROW ================= */
.stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin: 40px 0 48px;
}

.stat-card {
    background: linear-gradient(160deg, rgba(0, 255, 136, 0.04) 0%, rgba(0, 255, 136, 0.01) 100%);
    border: 1px solid rgba(0, 255, 136, 0.1);
    border-radius: 20px;
    padding: 24px 20px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
}

.stat-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.5), transparent);
}

.stat-card:hover {
    border-color: rgba(0, 255, 136, 0.3);
    transform: translateY(-3px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 136, 0.05);
}

.stat-card .icon {
    font-size: 22px;
    margin-bottom: 10px;
    display: block;
    opacity: 0.9;
}

.stat-card .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 700;
    color: #00ff88;
    line-height: 1;
    letter-spacing: -2px;
    margin-bottom: 6px;
}

.stat-card .lbl {
    font-size: 12px;
    color: #6a7290;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 500;
}

/* ================= CONTROL PANEL ================= */
.control-panel {
    background: rgba(10, 15, 25, 0.6);
    border: 1px solid rgba(0, 255, 136, 0.08);
    border-radius: 24px;
    padding: 24px;
    margin-bottom: 32px;
    backdrop-filter: blur(20px);
}

.search-wrap {
    position: relative;
    margin-bottom: 20px;
}

.search-wrap .search-icon {
    position: absolute;
    left: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    opacity: 0.5;
    pointer-events: none;
}

.search-wrap input {
    width: 100%;
    padding: 18px 60px 18px 60px;
    border-radius: 16px;
    border: 1px solid rgba(0, 255, 136, 0.12);
    background: #05080e;
    color: #ffffff;
    font-size: 15px;
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    outline: none;
    transition: all 0.25s ease;
}

.search-wrap input:focus {
    border-color: #00ff88;
    background: #070b12;
    box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.08);
}

.search-wrap input::placeholder {
    color: #4a5568;
}

.search-wrap .clear-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 107, 107, 0.1);
    color: #ff6b6b;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    opacity: 0;
    pointer-events: none;
}

.search-wrap .clear-btn.visible {
    opacity: 1;
    pointer-events: auto;
}

.search-wrap .clear-btn:hover {
    background: rgba(255, 107, 107, 0.25);
    transform: translateY(-50%) scale(1.1);
}

/* ================= FILTER CHIPS ================= */
.chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.chip {
    padding: 10px 20px;
    border-radius: 100px;
    border: 1px solid rgba(0, 255, 136, 0.12);
    background: transparent;
    color: #8892a8;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.chip:hover {
    border-color: rgba(0, 255, 136, 0.4);
    color: #00ff88;
    background: rgba(0, 255, 136, 0.04);
}

.chip.active {
    border-color: #00ff88;
    color: #000000;
    background: #00ff88;
    font-weight: 600;
    box-shadow: 0 0 24px rgba(0, 255, 136, 0.25);
}

.chip .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 100px;
    background: rgba(255, 255, 255, 0.06);
}

.chip.active .count {
    background: rgba(0, 0, 0, 0.15);
}

/* ================= RESULTS BAR ================= */
.results-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 0 4px;
    color: #6a7290;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 10px;
}

.results-bar strong {
    color: #00ff88;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
}

/* ================= CARDS GRID ================= */
.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
}

/* ================= CARD ================= */
.card {
    background: linear-gradient(165deg, #0b0f18 0%, #060910 100%);
    border: 1px solid rgba(0, 255, 136, 0.08);
    border-radius: 20px;
    padding: 26px 24px 22px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    display: flex;
    flex-direction: column;
    animation: cardIn 0.5s ease backwards;
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.card:hover::before {
    opacity: 1;
}

.card:hover {
    border-color: rgba(0, 255, 136, 0.25);
    transform: translateY(-6px);
    box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(0, 255, 136, 0.1),
        0 0 60px rgba(0, 255, 136, 0.06);
    background: linear-gradient(165deg, #0e1420 0%, #080c14 100%);
}

.card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
}

/* ===== KALI LINUX IMAGE STYLING ===== */
.card-icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(0, 255, 136, 0.08), rgba(0, 217, 255, 0.04));
    border: 1px solid rgba(0, 255, 136, 0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    padding: 8px;
    overflow: hidden;
}

.card-icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0, 255, 136, 0.3));
}

.card:hover .card-icon {
    transform: scale(1.08) rotate(-4deg);
    box-shadow: 0 0 24px rgba(0, 255, 136, 0.2);
    border-color: rgba(0, 255, 136, 0.3);
}

.card-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #4a5568;
    font-weight: 500;
    letter-spacing: 0.5px;
}

.card-cat {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 100px;
    background: rgba(0, 255, 136, 0.06);
    border: 1px solid rgba(0, 255, 136, 0.15);
    color: #00ff88;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-bottom: 14px;
}

.card-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.35;
    color: #ffffff;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
    flex: 1;
}

/* ===== URL HIDDEN ===== */
.card-url {
    display: none;
}

.card-actions {
    display: flex;
    gap: 10px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.04);
}

.btn-action {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-decoration: none;
    letter-spacing: 0.2px;
}

.btn-read {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    border-color: #00ff88;
    color: #001a0d;
    box-shadow: 0 4px 16px rgba(0, 255, 136, 0.2);
}

.btn-read:hover {
    background: linear-gradient(135deg, #00ffaa, #00dd77);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 255, 136, 0.35);
}

.btn-copy {
    background: rgba(0, 217, 255, 0.04);
    border-color: rgba(0, 217, 255, 0.25);
    color: #00d9ff;
    flex: 0 0 auto;
    padding: 12px 18px;
}

.btn-copy:hover {
    background: rgba(0, 217, 255, 0.12);
    border-color: #00d9ff;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 217, 255, 0.15);
}

/* ================= EMPTY ================= */
.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 24px;
    background: rgba(10, 15, 25, 0.4);
    border: 1px dashed rgba(0, 255, 136, 0.15);
    border-radius: 24px;
}

.empty .ico {
    font-size: 64px;
    margin-bottom: 20px;
    display: block;
    opacity: 0.7;
}

.empty h3 {
    font-size: 24px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 10px;
}

.empty p {
    color: #6a7290;
    font-size: 15px;
}

/* ================= FOOTER ================= */
.lib-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 0 0;
    border-top: 1px solid rgba(0, 255, 136, 0.08);
    color: #4a5568;
    font-size: 13px;
    flex-wrap: wrap;
    gap: 12px;
}

.lib-footer .brand {
    font-family: 'JetBrains Mono', monospace;
    color: #00ff88;
    font-weight: 700;
    letter-spacing: 1px;
}

/* ================= TOAST ================= */
.cs-toast {
    position: fixed;
    bottom: 32px;
    right: 32px;
    background: #0b0f18;
    border: 1px solid #00ff88;
    border-radius: 16px;
    padding: 16px 24px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Outfit', sans-serif;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 255, 136, 0.15);
    transform: translateY(150px);
    opacity: 0;
    transition: all 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    z-index: 99999;
    max-width: 90vw;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
}

.cs-toast.show {
    transform: translateY(0);
    opacity: 1;
}

.cs-toast.error {
    border-color: #ff6b6b;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 107, 107, 0.2);
}

/* ================= RESPONSIVE ================= */

    .search-wrap input { padding: 16px 54px 16px 54px; font-size: 14px; }
    .cs-toast { left: 20px; right: 20px; bottom: 20px; padding: 14px 20px; }
}

@media (max-width: 480px) {
    .cyber-inner { padding: 24px 14px 40px; }

    .hero h1 { font-size: 32px; }
    .hero-badge { font-size: 10px; padding: 6px 14px; letter-spacing: 1.5px; }
    .stats-row { gap: 10px; }
    .stat-card { padding: 18px 16px; border-radius: 16px; }
    .stat-card .num { font-size: 24px; }
    .stat-card .lbl { font-size: 10px; }
    .card { padding: 22px 20px 18px; border-radius: 18px; }
    .card-title { font-size: 16px; }
    .card-icon { width: 48px; height: 48px; padding: 6px; }
    .btn-action { padding: 11px 14px; font-size: 12px; }
    .chip { padding: 8px 14px; font-size: 12px; }
    .results-bar { font-size: 12px; }
}
</style>

        '<stop offset="100%" stop-color="#00cc6a"/>' +
        '</linearGradient>' +
        '</defs>' +
        '<path d="M100 30 C110 35 118 48 116 60 C114 72 106 82 96 86 L98 96 C98 100 96 104 92 106 L88 108 C86 110 82 112 78 110 L76 104 C70 108 62 110 54 110 L50 116 C46 120 40 120 36 116 L34 110 C26 106 20 98 18 88 L10 84 C6 82 4 76 6 70 L12 66 C14 56 20 46 30 40 L26 32 C24 26 28 20 34 20 L40 24 C46 20 54 18 62 18 L66 12 C70 8 76 8 80 12 L82 18 C88 20 94 24 100 30 Z" ' +
        'fill="url(#kg)" stroke="#00ff88" stroke-width="1.5"/>' +
        '<circle cx="80" cy="55" r="5" fill="#000"/>' +
        '<circle cx="80" cy="55" r="2" fill="#00ff88"/>' +
        '<path d="M60 40 L70 44 M50 55 L58 60 M40 70 L48 74" stroke="#000" stroke-width="2" fill="none" opacity="0.4"/>' +
        '</svg>'
    );

    var state = { search: '', category: 'all' };

    var el = {
        grid: document.getElementById('cardsGrid'),
        chipRow: document.getElementById('chipRow'),
        searchInput: document.getElementById('searchInput'),
        clearBtn: document.getElementById('clearBtn'),
        shownCount: document.getElementById('shownCount'),
        totalShow: document.getElementById('totalShow'),
        activeFilter: document.getElementById('activeFilter'),
        statTotal: document.getElementById('statTotal'),
        statCats: document.getElementById('statCats'),
        statHack: document.getElementById('statHack'),
        statTools: document.getElementById('statTools'),
        toast: document.getElementById('csToast')
    };

    function getCategories() {
        var map = {};
        posts.forEach(function(p){
            var c = p.category || 'Other';
            map[c] = (map[c] || 0) + 1;
        });
        return map;
    }

    function escapeHtml(s){
        if (s == null) return '';
        return String(s).replace(/[&<>"']/g, function(m){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
        });
    }

    function renderStats() {
        var cats = getCategories();
        el.statTotal.textContent = posts.length;
        el.statCats.textContent = Object.keys(cats).length;
        el.statHack.textContent = cats['Ethical Hacking'] || 0;
        el.statTools.textContent = cats['Security Tools'] || 0;
    }

    function renderChips() {
        var cats = getCategories();
        var html = '<button class="chip active" data-cat="all">📌 All <span class="count">' + posts.length + '</span></button>';
        Object.keys(cats).sort().forEach(function(c){
            html += '<button class="chip" data-cat="' + escapeHtml(c) + '">' + escapeHtml(c) + ' <span class="count">' + cats[c] + '</span></button>';
        });
        el.chipRow.innerHTML = html;

        el.chipRow.querySelectorAll('.chip').forEach(function(btn){
            btn.addEventListener('click', function(){
                el.chipRow.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('active'); });
                this.classList.add('active');
                state.category = this.getAttribute('data-cat');
                render();
            });
        });
    }

    function render() {
        var term = state.search.toLowerCase().trim();
        var list = posts.filter(function(p){
            var okCat = state.category === 'all' || p.category === state.category;
            var okTerm = !term ||
                (p.title || '').toLowerCase().indexOf(term) !== -1 ||
                (p.category || '').toLowerCase().indexOf(term) !== -1;
            return okCat && okTerm;
        });

        el.shownCount.textContent = list.length;
        el.totalShow.textContent = posts.length;
        el.activeFilter.textContent = state.category === 'all' ? '' : '· ' + state.category;

        if (list.length === 0) {
            el.grid.innerHTML = '<div class="empty"><span class="ico">📭</span><h3>No tutorials found</h3><p>Try adjusting your search or filter.</p></div>';
            return;
        }

        var html = '';
        list.forEach(function(p, i){
            var title = escapeHtml(p.title);
            var url = escapeHtml(p.url);
            var cat = escapeHtml(p.category);
            var delay = Math.min(i * 0.04, 0.6).toFixed(2) + 's';

            html += ''
                + '<div class="card" style="animation-delay:' + delay + '">'
                +   '<div class="card-head">'
                +     '<div class="card-icon"><img src="' + KALI_IMG + '" alt="Kali Linux" loading="lazy"></div>'
                +     '<div class="card-num">#' + String(i+1).padStart(2,'0') + '</div>'
                +   '</div>'
                +   '<div class="card-cat">' + cat + '</div>'
                +   '<div class="card-title">' + title + '</div>'
                +   '<div class="card-url">' + url + '</div>'
                +   '<div class="card-actions">'
                +     '<a class="btn-action btn-read" href="' + url + '" target="_blank" rel="noopener">📖 Read Now</a>'
                +     '<button class="btn-action btn-copy" data-url="' + url + '">📋</button>'
                +   '</div>'
                + '</div>';
        });
        el.grid.innerHTML = html;

        el.grid.querySelectorAll('.btn-copy').forEach(function(b){
            b.addEventListener('click', function(){
                copy(this.getAttribute('data-url'));
            });
        });
    }

    function copy(text){
        if (navigator.clipboard && window.isSecureContext){
            navigator.clipboard.writeText(text).then(function(){
                toast('📋 Link copied!', 'success');
            }).catch(function(){ fallback(text); });
        } else {
            fallback(text);
        }
    }

    function fallback(text){
        var t = document.createElement('textarea');
        t.value = text;
        t.style.position = 'fixed';
        t.style.opacity = '0';
        document.body.appendChild(t);
        t.select();
        try {
            document.execCommand('copy');
            toast('📋 Link copied!', 'success');
        } catch(e){
            toast('❌ Copy failed', 'error');
        }
        document.body.removeChild(t);
    }

    var toastTimer;
    function toast(msg, type){
        el.toast.textContent = msg;
        el.toast.className = 'cs-toast show ' + (type || 'success');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function(){
            el.toast.classList.remove('show');
        }, 2200);
    }

    el.searchInput.addEventListener('input', function(){
        state.search = this.value;
        el.clearBtn.classList.toggle('visible', this.value.length > 0);
        render();
    });

    el.clearBtn.addEventListener('click', function(){
        el.searchInput.value = '';
        state.search = '';
        this.classList.remove('visible');
        render();
        el.searchInput.focus();
    });

    document.addEventListener('keydown', function(e){
        if ((e.ctrlKey || e.metaKey) && e.key === 'f'){
            e.preventDefault();
            el.searchInput.focus();
            el.searchInput.select();
        }
        if (e.key === 'Escape' && document.activeElement === el.searchInput){
            el.searchInput.value = '';
            state.search = '';
            el.clearBtn.classList.remove('visible');
            render();
            el.searchInput.blur();
        }
    });

    renderStats();
    renderChips();
    render();

})();
</script>
